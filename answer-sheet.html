<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پاسخنامه آزمون</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

.exam-card{

max-width:900px;

margin:auto;

}

.user-info{

background:#ffffff20;

padding:15px;

border-radius:15px;

margin-bottom:20px;

color:white;

}

.download-btn{

display:block;

width:250px;

margin:20px auto;

padding:15px;

text-align:center;

background:white;

color:#2563eb;

text-decoration:none;

font-weight:bold;

border-radius:12px;

}

.question{

background:#ffffff18;

padding:15px;

border-radius:15px;

margin-bottom:20px;

color:white;

}

.options{

display:flex;

gap:20px;

margin-top:10px;

flex-wrap:wrap;

}

.options label{

cursor:pointer;

}

.submit-btn{

width:100%;

padding:18px;

font-size:18px;

border:none;

border-radius:15px;

background:white;

color:#2563eb;

font-weight:bold;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<div class="card exam-card">

<h2 style="text-align:center;color:white;margin-bottom:20px;">

پاسخنامه آزمون

</h2>

<div class="user-info">

<div id="userName"></div>

<div id="userGrade"></div>

</div>

<a href="assets/pdf/questions.pdf"

download

class="download-btn">

دانلود دفترچه سوالات

</a>

<form id="answerForm">

<div id="questions"></div>

<button class="submit-btn">

ثبت پاسخنامه

</button>

</form>

</div>

</div>

<script>

const user=JSON.parse(localStorage.getItem("examUser"));

document.getElementById("userName").innerHTML="نام: "+user.firstName+" "+user.lastName;

document.getElementById("userGrade").innerHTML="پایه: "+user.grade;

const container=document.getElementById("questions");

for(let i=1;i<=10;i++){

container.innerHTML+=`

<div class="question">

<b>سوال ${i}</b>

<div class="options">

<label><input type="radio" name="q${i}" value="1"> گزینه ۱</label>

<label><input type="radio" name="q${i}" value="2"> گزینه ۲</label>

<label><input type="radio" name="q${i}" value="3"> گزینه ۳</label>

<label><input type="radio" name="q${i}" value="4"> گزینه ۴</label>

</div>

</div>

`;

}

document.getElementById("answerForm").addEventListener("submit",function(e){

e.preventDefault();

let answers=[];

for(let i=1;i<=10;i++){

const selected=document.querySelector('input[name="q'+i+'"]:checked');

answers.push(selected?selected.value:"");

}

localStorage.setItem("answers",JSON.stringify(answers));

alert("پاسخنامه ثبت شد.");

});

</script>

</body>

</html>
